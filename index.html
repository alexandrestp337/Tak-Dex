<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PokéTact</title><link rel="stylesheet" href="styles.css"><link rel="manifest" href="manifest.webmanifest"></head><body><header><h1>PokéTact</h1><button id="theme">☀ Theme</button></header><nav><button id="teamsTab" class="selected">My teams</button><button id="battleTab">Battle</button></nav><main><section id="teamsPage"><div class="bar"><h2>My teams</h2><button id="addTeam">+ New team</button></div><div id="teams"></div><section id="editor" hidden><div class="bar"><h2 id="editorTitle"></h2><button id="closeTeam">Close</button></div><p id="editorGame"></p><div id="slots"></div></section></section><section id="battlePage" hidden><h2>Battle matchup</h2><p>Choose the opposing Pokémon to see how effective your team's moves are.</p><label>Opponent Pokémon<div class="search"><input id="foeInput" autocomplete="off" placeholder="Start typing…"><div id="foeResults" class="suggestions" hidden></div></div></label><div id="foePreview"></div><div id="matchups"></div></section></main><dialog id="newDialog"><form id="newForm"><h2>New team</h2><label>Team name<input id="teamName" required maxlength="40" placeholder="My Emerald team"></label><label>Game<select id="game"></select></label><div class="buttons"><button type="button" id="cancelNew">Cancel</button><button>Create team</button></div></form></dialog><dialog id="pokeDialog"><form id="pokeForm"><div class="bar"><h2 id="pokeHeading">Pokémon</h2><button type="button" id="cancelPoke">×</button></div><label>Pokémon<div class="search"><input id="pokeInput" autocomplete="off" placeholder="Start typing…"><div id="pokeResults" class="suggestions" hidden></div></div></label><div id="pokePreview"></div><h3>Attacks</h3><div id="moveFields"></div><p class="note" id="moveNote">Select a Pokémon to load its moves.</p><p class="error" id="error" hidden></p><div class="buttons"><button type="button" id="removePoke">Remove</button><button id="savePoke" disabled>Save Pokémon</button></div></form></dialog><footer>Team data is saved on this device. First Pokémon lookup needs internet.</footer><script src="app.js"></script></body></html>
